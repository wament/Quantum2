name: CI (Build & Test)

# GITHUB_ACTIONS=true, so CMakeLists.txt routes through the vcpkg toolchain and
# requires SFML 3.x (vcpkg provides it; the system package is only 2.6.1).
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything vcpkg-related lives here. We cache this whole directory (the clone
  # + installed binaries) together with the CMake build tree. Crucially the cache
  # key below does NOT include github.sha, so consecutive pushes reuse it exactly
  # instead of creating a throwaway cache on every run.
  VCPKG_INSTALLATION_DIRECTORY: ${{ github.workspace }}/vcpkg

jobs:
  build-test-linux:
    runs-on: ubuntu-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux
      # Runtime linker path so the dynamic SFML tests find their .so files.
      LD_LIBRARY_PATH: "${{ github.workspace }}/vcpkg/installed/x64-linux/lib:${{ github.workspace }}/vcpkg/installed/x64-linux/bin"
      # Force software OpenGL so SFML windows open under headless Xvfb.
      LIBGL_ALWAYS_SOFTWARE: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies for dynamic SFML
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxkbcommon-x11-dev libxcursor-dev libxi-dev libxinerama-dev \
            libxrandr-dev libgl1-mesa-dev libasound2-dev libudev-dev \
            mesa-utils libgl1-mesa-dri xvfb ninja-build

      # ONE cache entry for BOTH vcpkg and the CMake build tree, keyed only on the
      # dependency manifest (+ CMakeLists so a changed toolchain forces a clean
      # rebuild). restore-keys lets a manifest change fall back onto the previous
      # packages and rebuild only what changed.
      - name: Cache vcpkg + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_DIRECTORY }}
            ${{ github.workspace }}/build
          key: "${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-${{ hashFiles('**/vcpkg.json', 'CMakeLists.txt') }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-

      - name: Clone vcpkg (only on a cache miss)
        run: |
          if [ ! -f "${{ env.VCPKG_INSTALLATION_DIRECTORY }}/scripts/buildsystems/vcpkg.cmake" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_INSTALLATION_DIRECTORY }}"
          fi

      - name: Pin vcpkg to a reproducible baseline (optional; set VCPKG_COMMIT_ID)
        run: |
          if [ -n "$VCPKG_COMMIT_ID" ]; then
            git -C "${{ env.VCPKG_INSTALLATION_DIRECTORY }}" checkout "$VCPKG_COMMIT_ID"
          fi

      # Always re-bootstrap: fast, and it guarantees the vcpkg binary keeps its
      # execute bit after a cache restore (a well-known actions/cache quirk).
      - name: Bootstrap vcpkg
        run: "${{ env.VCPKG_INSTALLATION_DIRECTORY }}/bootstrap-vcpkg.sh"

      - name: Install vcpkg packages
        run: |
          # "builtin-baseline" in vcpkg.json pins the registry commit here, so CI resolves
          # the EXACT SAME SFML version as local dev (which uses the same manifest). No SHA duplication.
          "${{ env.VCPKG_INSTALLATION_DIRECTORY }}/vcpkg" install --triplet x64-linux

      - name: Configure CMake
        run: |
          # Ninja is already installed above; it parallelizes and tracks incremental
          # rebuilds far better than the default Unix Makefiles generator.
          cmake -B build \
            -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_INSTALLATION_DIRECTORY }}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests (headless)
        run: xvfb-run -a ctest --test-dir build --output-on-failure --timeout 300
