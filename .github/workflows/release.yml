name: Release (Build & Publish)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_INSTALLATION_DIRECTORY: ${{ github.workspace }}/vcpkg

jobs:

  # macOS. Triplet follows the runner arch (macos-latest can be X64 or ARM64);
  # vcpkg triplets are lower-case, so map instead of hardcoding arm64-osx.
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg + build artifacts (shared key reuses across pushes)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_DIRECTORY }}
            ${{ github.workspace }}/build
          key: "${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-${{ hashFiles('**/vcpkg.json', 'CMakeLists.txt') }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-

      - name: Clone vcpkg (only on a cache miss)
        run: |
          if [ ! -f "${{ env.VCPKG_INSTALLATION_DIRECTORY }}/scripts/buildsystems/vcpkg.cmake" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_INSTALLATION_DIRECTORY }}"
          fi

      # Re-bootstrap guarantees the vcpkg binary keeps its execute bit after a cache restore.
      - name: Bootstrap vcpkg
        run: "${{ env.VCPKG_INSTALLATION_DIRECTORY }}/bootstrap-vcpkg.sh"

      - name: Detect macOS architecture (x64 vs arm64)
        id: mac-arch
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then echo "triplet=arm64-osx" >> "$GITHUB_OUTPUT"; else echo "triplet=x64-osx" >> "$GITHUB_OUTPUT"; fi

      - name: Install vcpkg packages
        run: |
          "${{ env.VCPKG_INSTALLATION_DIRECTORY }}/vcpkg" install --triplet "${{ steps.mac-arch.outputs.triplet }}"

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_INSTALLATION_DIRECTORY }}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package macOS (.app -> .zip)
        run: |
          set -e
          EXE=$(find build -maxdepth 1 \( -name Blackjack2.exe -o -name 'Blackjack2' \) | head -n1)
          if [ -z "$EXE" ]; then echo "Blackjack2 not found under build/"; exit 1; fi
          # Ship a .zip of the app bundle instead of a DMG: hdiutil create fails on GitHub's
          # macOS runners with "Function not implemented" (filesystem ioctl unsupported).
          PKG="dist/macOS-build"
          STAGE="$PKG/stage"
          rm -rf "$PKG"; mkdir -p "$PKG"
          APP="$STAGE/Blackjack2.app"; mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$EXE" "$APP/Contents/MacOS/Blackjack2"; cp -R assets "$APP/Contents/Resources/"
          cd "$STAGE"
          zip -r "$PKG/Blackjack2-macOS.zip" Blackjack2.app

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: dist/macOS-build/Blackjack2-macOS.zip
          if-no-files-found: error

  # Windows. Discover the exe dynamically so this works regardless of which generator
  # (Ninja is default on windows-latest and places it in build/, not build/Release).
  build-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache vcpkg + build artifacts (shared key reuses across pushes)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_DIRECTORY }}
            ${{ github.workspace }}/build
          key: "${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-${{ hashFiles('**/vcpkg.json', 'CMakeLists.txt') }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-

      - name: Clone vcpkg (only on a cache miss)
        shell: pwsh
        run: |
          $vcroot = $env:VCPKG_INSTALLATION_DIRECTORY
          if (-not (Test-Path -LiteralPath "$vcroot/scripts/buildsystems/vcpkg.cmake")) {
            git clone https://github.com/microsoft/vcpkg.git "$vcroot"
          }

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $vcroot = $env:VCPKG_INSTALLATION_DIRECTORY
          & "$vcroot/bootstrap-vcpkg.bat"

      - name: Install vcpkg packages
        shell: pwsh
        run: |
          $vcroot = $env:VCPKG_INSTALLATION_DIRECTORY
          & "$vcroot/vcpkg.exe" install --triplet x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_DIRECTORY "scripts/buildsystems/vcpkg.cmake"
          cmake -B build --toolchain $toolchain -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package Windows (locate exe + copy DLLs + zip)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse -Path build -Filter Blackjack2.exe | Select-Object -First 1
          if (-not $exe) { throw "Blackjack2.exe not found under build/" }
          Write-Host "Found: $($exe.FullName)"
          $vcpkgBin = "$env:VCPKG_INSTALLATION_DIRECTORY/installed/x64-windows/bin"
          $pkgDir = "dist/windows-build"
          if (Test-Path -LiteralPath $pkgDir) { Remove-Item -Recurse -Force $pkgDir }
          New-Item -ItemType Directory -Path $pkgDir -Force
          Copy-Item $exe.FullName -Destination $pkgDir -Force
          Copy-Item -Recurse assets -Destination "$pkgDir/assets" -Force
          if (Test-Path -LiteralPath $vcpkgBin) {
            Get-ChildItem -Path $vcpkgBin -Filter *.dll | ForEach-Object {
              Copy-Item $_.FullName -Destination $pkgDir -Force
              Write-Host "Copied DLL: $($_.Name)"
            }
          }
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "Blackjack2-Windows.zip"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Blackjack2-Windows.zip
          if-no-files-found: error

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: dist/macos-build

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: dist/windows-build

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            dist/macos-build/Blackjack2-macOS.zip
            dist/windows-build/Blackjack2-Windows.zip
          generate_release_notes: true

