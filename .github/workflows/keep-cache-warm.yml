name: Keep CI Cache Warm

# release.yml only triggers on tags (infrequent), and GitHub evicts caches that go
# idle, so the macOS/Windows release builds start cold almost every time. This runs
# the same install+build weekly (and manually) to refresh/save the SAME cache entries
# release.yml uses - the key expression is identical, so warming here keeps real
# releases warm too.

on:
  schedule:
    - cron: '0 3 * * 1'   # Mondays 03:00 UTC; adjust frequency vs. eviction window
  workflow_dispatch:

permissions:
  contents: read

env:
  VCPKG_INSTALLATION_DIRECTORY: ${{ github.workspace }}/vcpkg

jobs:
  keep-warm-windows:
    runs-on: windows-latest
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg + build artifacts (shared key with release.yml)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_DIRECTORY }}
            ${{ github.workspace }}/build
          key: "${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-${{ hashFiles('**/vcpkg.json', 'CMakeLists.txt') }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-

      - name: Clone vcpkg (only on a cache miss)
        shell: pwsh
        run: |
          $vcroot = $env:VCPKG_INSTALLATION_DIRECTORY
          if (-not (Test-Path -LiteralPath "$vcroot/scripts/buildsystems/vcpkg.cmake")) {
            git clone https://github.com/microsoft/vcpkg.git "$vcroot"
          }

      - name: Bootstrap vcpkg
        shell: pwsh
        run: "& '$env:VCPKG_INSTALLATION_DIRECTORY/bootstrap-vcpkg.bat'"

      - name: Install vcpkg packages
        shell: pwsh
        run: "& '$env:VCPKG_INSTALLATION_DIRECTORY/vcpkg.exe' install --triplet x64-windows"

      - name: Configure CMake
        shell: pwsh
        run: "cmake -B build --toolchain \"$env:VCPKG_INSTALLATION_DIRECTORY/scripts/buildsystems/vcpkg.cmake\" -DCMAKE_BUILD_TYPE=Release"

      - name: Build
        run: cmake --build build --parallel

  keep-warm-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache vcpkg + build artifacts (shared key with release.yml)
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_INSTALLATION_DIRECTORY }}
            ${{ github.workspace }}/build
          key: "${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-${{ hashFiles('**/vcpkg.json', 'CMakeLists.txt') }}"
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-vcpkg-cmake-

      - name: Clone vcpkg (only on a cache miss)
        run: |
          if [ ! -f "${{ env.VCPKG_INSTALLATION_DIRECTORY }}/scripts/buildsystems/vcpkg.cmake" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${{ env.VCPKG_INSTALLATION_DIRECTORY }}"
          fi

      - name: Bootstrap vcpkg
        run: "${{ env.VCPKG_INSTALLATION_DIRECTORY }}/bootstrap-vcpkg.sh"

      - name: Detect macOS architecture (x64 vs arm64)
        id: mac-arch
        shell: bash
        run: |
          if [ "$(uname -m)" = "arm64" ]; then echo "triplet=arm64-osx" >> "$GITHUB_OUTPUT"; else echo "triplet=x64-osx" >> "$GITHUB_OUTPUT"; fi

      - name: Install vcpkg packages
        run: "${{ env.VCPKG_INSTALLATION_DIRECTORY }}/vcpkg" install --triplet "${{ steps.mac-arch.outputs.triplet }}"

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_TOOLCHAIN_FILE="${{ env.VCPKG_INSTALLATION_DIRECTORY }}/scripts/buildsystems/vcpkg.cmake" \
            -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel
