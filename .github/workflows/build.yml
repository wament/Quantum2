name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use vcpkg and install SFML
        uses: lukka/run-vcpkg@v11.6
        with:
          runVcpkgInstall: true
        env:
          VCPKG_DEFAULT_TRIPLET: arm64-osx

      - name: Configure CMake
        run: cmake -B build -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -G "Unix Makefiles"

      - name: Build
        run: cmake --build build --parallel

      - name: Package macOS
        run: |
          APP_DIR="Blackjack2.app"
          MACOS_DIR="$APP_DIR/Contents/MacOS"
          RESOURCES_DIR="$APP_DIR/Contents/Resources"

          mkdir -p "$MACOS_DIR"
          mkdir -p "$RESOURCES_DIR/assets"

          # Copy executable
          cp build/Blackjack2 "$MACOS_DIR/"

          # Copy assets
          cp -R assets "$RESOURCES_DIR/assets"

          # Copy SFML frameworks AND dependencies from vcpkg to app's Frameworks/
          mkdir -p "$APP_DIR/Contents/Frameworks"
          vcpkg_lib="$VCPKG_ROOT/installed/arm64-osx/lib"

          # Copy SFML frameworks
          cp -R "$vcpkg_lib"/SFML-*.framework "$APP_DIR/Contents/Frameworks/" || true

          # Copy other SFML dependencies (FreeType, etc.)
          # FreeType is used by SFML-Graphics for fonts
          if [ -f "$vcpkg_lib/libfreetype.dylib" ]; then
            cp "$vcpkg_lib/libfreetype.dylib" "$APP_DIR/Contents/Frameworks/"
          fi
          if [ -d "$vcpkg_lib/freetype.framework" ]; then
            cp -R "$vcpkg_lib/freetype.framework" "$APP_DIR/Contents/Frameworks/"
          fi

          # Fix rpaths so the app finds the frameworks at runtime
          if [ -d "$APP_DIR/Contents/Frameworks" ]; then
            install_name_tool -add_rpath "@executable_path/../Frameworks" "$MACOS_DIR/Blackjack2"

            # Also fix rpaths inside the frameworks to find each other
            for fw in "$APP_DIR/Contents/Frameworks/"*.framework; do
              if [ -f "$fw/$(basename $fw .framework)" ]; then
                install_name_tool -add_rpath "@executable_path/../Frameworks" "$fw/$(basename $fw .framework)" || true
              fi
            done
          fi

          # Create DMG
          hdiutil create -volname "Blackjack2" -srcfolder "$APP_DIR" -ov -format UDZO "Blackjack2-macOS.dmg"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: Blackjack2-macOS.dmg

          
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use vcpkg and install SFML
        uses: lukka/run-vcpkg@v11.6
        with:
          runVcpkgInstall: true
        env:
          VCPKG_DEFAULT_TRIPLET: x64-windows

      - name: Configure CMake
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:VCPKG_ROOT "scripts/buildsystems/vcpkg.cmake"
          Write-Host "Using vcpkg toolchain: $toolchain"
          cmake -B build --toolchain $toolchain -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package Windows
        shell: pwsh
        run: |
          $buildDir = "build\Release"
          $pkgDir = "package"
          New-Item -ItemType Directory -Path $pkgDir -Force

          # Copy executable
          Copy-Item "$buildDir\Blackjack2.exe" $pkgDir\

          # Copy assets
          Copy-Item -Recurse assets "$pkgDir\assets"

          # Copy ALL runtime DLLs from vcpkg (SFML + dependencies: freetype, openal, etc.)
          $vcpkgBin = Join-Path "$env:VCPKG_ROOT\installed\x64-windows" "bin"
          Copy-Item "$vcpkgBin\*.dll" "$pkgDir\" -Force

          Compress-Archive -Path "$pkgDir\*" -DestinationPath "Blackjack2-Windows.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: Blackjack2-Windows.zip

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ secrets.RELEASE_REPO_OWNER }}/${{ secrets.RELEASE_REPO_NAME }}
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            windows-build/Blackjack2-Windows.zip
            macos-build/Blackjack2-macOS.dmg
          generate_release_notes: true